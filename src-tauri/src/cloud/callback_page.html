<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>{{heading}} · WireTerm</title>
<style>
	:root {
		--bg: #fff; --fg: #0a0a0a; --card: #fff; --muted: #666;
		--line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.16); --glow: rgba(0,0,0,.045);
		--font-sans: "Schibsted Grotesk Variable", "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
		--font-mono: "JetBrains Mono Variable", "JetBrains Mono", ui-monospace, monospace;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #050505; --fg: #f4f4f4; --card: #0c0c0c; --muted: #8f8f8f;
			--line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.18); --glow: rgba(255,255,255,.07);
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0; min-height: 100dvh; display: flex; flex-direction: column;
		background: var(--bg); color: var(--fg);
		font-family: var(--font-sans); line-height: 1.5; -webkit-font-smoothing: antialiased;
	}
	header { border-bottom: 1px solid var(--line); }
	.bar { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 18px; }
	.brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; letter-spacing: -.03em; }
	.brand svg { height: 24px; width: auto; fill: currentColor; }
	main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
	.card {
		width: 100%; max-width: 28rem; padding: 32px; display: flex; flex-direction: column; gap: 16px;
		background: var(--card) radial-gradient(90% 60% at 50% 0%, var(--glow), transparent 70%);
		border: 1px solid var(--line); border-radius: 20px;
	}
	.mark {
		width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
		border: 1px solid var(--line-2); font-size: 20px; font-weight: 600;
	}
	.status { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; }
	.label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
	h1 { margin: 0; font-size: clamp(26px, 5vw, 32px); line-height: 1.1; font-weight: 600; letter-spacing: -.03em; text-wrap: balance; }
	p { margin: 0; color: var(--muted); text-wrap: pretty; }
	@media (forced-colors: active) { .card, .mark { border-color: CanvasText; } }
</style>
</head>
<body>
<header>
	<div class="bar">
		<span class="brand">
			<svg viewBox="0 0 1308 1483" aria-hidden="true"><path fill-rule="evenodd" d="M654 0 1308 378V1105L654 1483 0 1105V378ZM654 93 92 417V1066L654 1390 1215 1066V417Z"/><path d="M448 515 713 360 1262 677V784L713 467 494 594Z"/><path d="M46 721 594 1037 814 910 859 990 594 1143 46 828Z"/><circle cx="411" cy="588" r="83"/><circle cx="896" cy="915" r="83"/></svg>
			WireTerm
		</span>
	</div>
</header>
<main>
	<div class="card">
		<h1>{{heading}}</h1>
		<div class="status">
			<span class="mark" aria-hidden="true">{{mark}}</span>
			<span class="label">{{label}}</span>
		</div>
		<p>{{text}}</p>
	</div>
</main>
</body>
</html>
