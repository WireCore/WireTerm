_version: 2
# Messages from syncing a cloud workspace: the queue, the diff, the wire model,
# the envelope encryption and the organization calls (src/cloud/{sync,cache,
# diff,model,crypto,org}.rs).

# ---- Queued changes, as named in an error message (cache.rs) ----------------
cloud_sync.op_rename_workspace:
  en: 'Rename workspace "%{name}"'
  de: "Workspace „%{name}“ umbenennen"
cloud_sync.op_create_project:
  en: 'Create project "%{name}"'
  de: "Projekt „%{name}“ anlegen"
cloud_sync.op_update_project:
  en: 'Change project "%{name}"'
  de: "Projekt „%{name}“ ändern"
cloud_sync.op_delete_project:
  en: "Delete project"
  de: "Projekt löschen"
cloud_sync.op_grant_keys:
  en: "Distribute project keys"
  de: "Projektschlüssel verteilen"
cloud_sync.op_create_connection:
  en: 'Create connection "%{name}"'
  de: "Verbindung „%{name}“ anlegen"
cloud_sync.op_update_connection:
  en: 'Change connection "%{name}"'
  de: "Verbindung „%{name}“ ändern"
cloud_sync.op_delete_connection:
  en: "Delete connection"
  de: "Verbindung löschen"
cloud_sync.op_put_secret:
  en: "Upload secret"
  de: "Geheimnis hochladen"
cloud_sync.op_delete_secret:
  en: "Remove secret"
  de: "Geheimnis entfernen"
cloud_sync.op_put_vault_account:
  en: "Set vault account"
  de: "Tresorkonto setzen"
cloud_sync.op_delete_vault_account:
  en: "Remove vault account"
  de: "Tresorkonto entfernen"
cloud_sync.op_create_snippet:
  en: 'Create snippet "%{name}"'
  de: "Snippet „%{name}“ anlegen"
cloud_sync.op_update_snippet:
  en: 'Change snippet "%{name}"'
  de: "Snippet „%{name}“ ändern"
cloud_sync.op_delete_snippet:
  en: "Delete snippet"
  de: "Snippet löschen"

# ---- Sync (sync.rs) ---------------------------------------------------------
cloud_sync.conflict:
  en: "%{label}: changed by someone else in the meantime. Your change was discarded; theirs applies."
  de: "%{label}: inzwischen von jemand anderem geändert. Deine Änderung ist verworfen, es gilt dessen Stand."

# ---- Diff (diff.rs) ---------------------------------------------------------
cloud_sync.project_missing_from_cache:
  en: "A project is missing from the local copy."
  de: "Ein Projekt fehlt in der lokalen Kopie."
cloud_sync.no_project_key:
  en: "There is no project key for this project yet."
  de: "Für dieses Projekt gibt es noch keinen Projektschlüssel."
cloud_sync.project_key_unwrap_failed:
  en: "The project key cannot be unwrapped."
  de: "Der Projektschlüssel lässt sich nicht auspacken."
cloud_sync.vault_locked:
  en: "The vault is locked. Enter the master password to save."
  de: "Der Tresor ist gesperrt. Zum Speichern muss das Masterpasswort eingegeben werden."

