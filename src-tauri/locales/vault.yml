# Password managers: 1Password (op.rs), Bitwarden and Vaultwarden (bitwarden/),
# and the layer in front of both (vault.rs).

# ---- vault.rs ----------------------------------------------------------------
vault.user_name_unreadable:
  en: "could not read the user name from %{provider}: %{error}"
  de: "der Benutzername ließ sich nicht aus %{provider} lesen: %{error}"

