_version: 2
# Secrets on this device: the device key and the fields sealed with it
# (local_secrets/), secrets asked for at connect time (secret.rs), and the
# password-protected export of workspaces (export.rs).

# ---- local_secrets/mod.rs ----------------------------------------------------
secrets.not_sealed:
  en: "not an encrypted field"
  de: "kein verschlüsseltes Feld"
secrets.sealed_field_damaged:
  en: "the encrypted field is damaged"
  de: "das verschlüsselte Feld ist beschädigt"
secrets.field_not_text:
  en: "the field is not text"
  de: "das Feld ist kein Text"
secrets.not_password_wrapped:
  en: "the key is not stored under an app password"
  de: "der Schlüssel liegt nicht unter einem App-Passwort"
secrets.marker_damaged:
  en: "%{file} is damaged"
  de: "%{file} ist beschädigt"
secrets.marker_damaged_detail:
  en: "%{file} is damaged: %{error}"
  de: "%{file} ist beschädigt: %{error}"
secrets.wrong_app_password:
  en: "The app password is wrong."
  de: "Das App-Passwort stimmt nicht."
secrets.no_app_password:
  en: "There is no app password yet."
  de: "Es gibt noch kein App-Passwort."
secrets.already_set_up:
  en: "The local key is already set up."
  de: "Der lokale Schlüssel ist schon eingerichtet."
secrets.new_app_password_too_short:
  en: "The new app password needs at least eight characters."
  de: "Das neue App-Passwort braucht mindestens acht Zeichen."

# ---- secret.rs ---------------------------------------------------------------
secrets.no_window:
  en: "no window to ask for the secret"
  de: "kein Fenster, das nach dem Geheimnis fragen könnte"
secrets.nothing_given:
  en: "nothing was given"
  de: "es wurde nichts eingegeben"

# ---- export.rs ---------------------------------------------------------------
secrets.export_not_wireterm:
  en: "This is not a WireTerm export file."
  de: "Das ist keine Export-Datei von WireTerm."
secrets.export_unknown_version:
  en: "The file has format %{version}; this version of WireTerm only knows %{supported}."
  de: "Die Datei hat das Format %{version}; diese Fassung von WireTerm kennt nur %{supported}."
secrets.export_damaged:
  en: "The export file is damaged."
  de: "Die Export-Datei ist beschädigt."
secrets.export_damaged_detail:
  en: "The export file is damaged: %{error}"
  de: "Die Export-Datei ist beschädigt: %{error}"
secrets.export_wrong_password:
  en: "The password is wrong, or the file is damaged."
  de: "Das Passwort stimmt nicht, oder die Datei ist beschädigt."
secrets.export_password_too_short:
  en: "The password needs at least eight characters."
  de: "Das Passwort braucht mindestens acht Zeichen."
secrets.export_write_failed:
  en: "%{path} could not be written: %{error}"
  de: "%{path} ließ sich nicht schreiben: %{error}"
secrets.export_read_failed:
  en: "%{path} could not be read: %{error}"
  de: "%{path} ließ sich nicht lesen: %{error}"
