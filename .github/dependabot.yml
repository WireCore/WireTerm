version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 3.3.12 to 3.3.14 mis-type a slot scope in AccountWizard.vue; see the
      # commit that pinned it. Lift this once a release fixes it.
      - dependency-name: vue-tsc
      # TypeScript 7 drops the JavaScript compiler that vue-tsc builds on
      # (ERR_PACKAGE_PATH_NOT_EXPORTED). Lift this once vue-tsc supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The next RustCrypto generation (digest 0.11, cipher 0.5) does not fit
      # rsa 0.9 yet, and its crates only build with each other. They move
      # together, with rsa 0.10 (TODO.md) — in one change that is tested
      # against Bitwarden and the backend's envelope scheme.
      - dependency-name: aes
        versions: ['>= 0.9']
      - dependency-name: cbc
        versions: ['>= 0.2']
      - dependency-name: sha1
        versions: ['>= 0.11']
      - dependency-name: sha2
        versions: ['>= 0.11']
      - dependency-name: hkdf
        versions: ['>= 0.13']
      - dependency-name: chacha20poly1305
        versions: ['>= 0.11']
      - dependency-name: x25519-dalek
        versions: ['>= 3']
      - dependency-name: argon2
        versions: ['>= 0.6']
  - package-ecosystem: gomod
    directory: /sidecar
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
